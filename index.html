<title>Wizard Piano Alimentare</title>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1a1a1a;background:#f5f5f0;min-height:100vh;padding:1.5rem}
.wizard{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.progress-bar{display:flex;gap:6px;margin-bottom:2rem;align-items:center}
.step-dot{width:32px;height:32px;border-radius:50%;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#888;flex-shrink:0}
.step-dot.active{background:#2563eb;color:#fff;border-color:#2563eb}
.step-dot.done{background:#16a34a;color:#fff;border-color:#16a34a}
.step-line{flex:1;height:1px;background:#ddd}
.step-title{font-size:22px;font-weight:600;margin-bottom:.4rem}
.step-sub{font-size:14px;color:#666;margin-bottom:1.5rem}
.card{background:#f8f8f5;border:1px solid #e5e5e0;border-radius:12px;padding:1.25rem;margin-bottom:.75rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:.75rem}
.field-row.three{grid-template-columns:1fr 1fr 1fr}
.field-label{font-size:12px;color:#555;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input[type=number],input[type=text],select{width:100%;height:38px;padding:0 12px;border:1px solid #d0d0cc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px}

.option-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.option-btn{padding:10px 14px;border:1px solid #d0d0cc;border-radius:8px;background:#fff;color:#333;font-size:13px;cursor:pointer;text-align:left;line-height:1.4;transition:all .15s}
.option-btn:hover{border-color:#2563eb;background:#eff6ff}
.option-btn.selected{background:#dbeafe;border-color:#2563eb;color:#1d4ed8;font-weight:500}
.food-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:.5rem}
.food-item{padding:10px 12px;border:1px solid #e0e0db;border-radius:8px;background:#fff;cursor:pointer;transition:all .15s}
.food-item:hover{border-color:#2563eb}
.food-item.selected{background:#dcfce7;border-color:#16a34a}
.food-name{font-size:13px;font-weight:500;color:#1a1a1a}
.food-macro{font-size:11px;color:#888;margin-top:3px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#888;margin:1.2rem 0 .5rem}
.excl-grid{display:flex;flex-wrap:wrap;gap:8px}
.excl-btn{padding:7px 16px;border:1px solid #d0d0cc;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;color:#333;transition:all .15s}
.excl-btn.selected{background:#fee2e2;border-color:#dc2626;color:#b91c1c;font-weight:500}
.nav{display:flex;justify-content:space-between;margin-top:2rem;gap:12px}
.btn-back{padding:10px 20px;border:1px solid #d0d0cc;border-radius:8px;background:#fff;color:#333;font-size:14px;cursor:pointer}
.btn-next{padding:10px 24px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto}
.btn-next:hover{background:#1d4ed8}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.metric{background:#f8f8f5;border-radius:8px;padding:.75rem 1rem;border:1px solid #e5e5e0}
.metric-label{font-size:11px;color:#888;margin-bottom:4px;font-weight:600;text-transform:uppercase}
.metric-value{font-size:22px;font-weight:600;color:#1a1a1a}
.metric-unit{font-size:12px;color:#888;font-weight:400}

.result-header{background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;color:#fff}
.result-header h2{font-size:18px;font-weight:600;margin-bottom:.25rem}

input[type=time]{width:100%;height:38px;padding:0 11px;border:1px solid #d0d0cc;border-radius:8px;font-size:14px;color:#1a1a1a;background:#fff}
.abit-row{font-size:13px;color:#333;padding:5px 0;border-bottom:1px solid #f0f0eb;line-height:1.5}

.abit-q{font-weight:600;color:#1a1a1a}
.abit-a{color:#2563eb}
</style>
</head>

function calcBMR(s,e,p,h){
  return s==='M'?Math.round((10*p)+(6.25*h)-(5*e)+5):Math.round((10*p)+(6.25*h)-(5*e)-161);
}
function getMultiplier(passi,sport,freq){
  let base=1.2;
  if(passi>=10000)base=1.55;else if(passi>=7500)base=1.45;else if(passi>=5000)base=1.375;else if(passi>=3000)base=1.3;
  const bonus={nessuno:0,camminata:0.05,palestra:freq>=3?0.2:freq>=2?0.15:0.1,nuoto:freq>=3?0.2:0.15,ciclismo:freq>=2?0.15:0.1,corsa:freq>=3?0.25:0.15,altro:freq>=2?0.15:0.1};
  return Math.min(1.9,base+(bonus[sport]||0));
}
function getSurplus(ob){return ob==='massa'?1.1:ob==='dimagrimento'?0.85:1.0;}
function getMacros(tdee,peso,pf){
  const prot=Math.round(peso*(pf||1.8)),protKcal=prot*4;
  const fatKcal=Math.round(tdee*0.28),fat=Math.round(fatKcal/9);
  const carbKcal=tdee-protKcal-fatKcal,carb=Math.round(carbKcal/4);
  return{prot,fat,carb,protKcal,fatKcal,carbKcal};
}
function allFoods(){return[...FOODS.proteine,...FOODS.carboidrati,...FOODS.verdure,...FOODS.grassi];}
function filterEx(foods){
  const ex=data.esclusioni;
  return foods.filter(f=>{
    if(ex.includes('Uova')&&['uova','albumi'].includes(f.id))return false;
    if(ex.includes('Pesce')&&['tonno','salmone','nasello','sgombro','polpo'].includes(f.id))return false;

    if(ex.includes('Frutta a guscio')&&['mandorle','noci','pistacchi','nocciole'].includes(f.id))return false;

    if(ex.includes('Vegano')&&['uova','albumi','fiocchilatte','ricotta','greco','skyr','mozzarella','grana','whey'].includes(f.id))return false;
    return true;
  });
}

function calcCompletion(){
  // 5 pagine, ognuna con campi chiave. Ritorna {pct, dettaglio[]}
  const pages=[
    {nome:'Dati anagrafici', fields:[
      {ok:!!data.eta, label:'Et√†'},
      {ok:!!data.peso, label:'Peso'},
      {ok:!!data.altezza, label:'Altezza'},
      {ok:!!data.obiettivo, label:'Obiettivo'},
    ]},
    {nome:'Stile di vita', fields:[
      {ok:!!data.lavoro, label:'Tipo di lavoro'},
      {ok:!!data.passiTouched, label:'Passi giornalieri'},
      {ok:!!data.sport, label:'Attivit√† sportiva'},
    ]},
    {nome:'Esclusioni', fields:[
      {ok:data.esclusioniTouched===true, label:'Esclusioni confermate'},
    ]},
    {nome:'Alimenti', fields:[
      {ok:data.alimenti.length>=4, label:'Almeno 4 alimenti selezionati'},
    ]},
    {nome:'Abitudini', fields:[
      {ok:!!(data.abitudini&&data.abitudini.colazione), label:'Colazione'},
      {ok:!!(data.abitudini&&data.abitudini.treParti), label:'Tre pasti principali'},
      {ok:!!(data.abitudini&&data.abitudini.spuntino), label:'Spuntino'},
      {ok:!!(data.abitudini&&data.abitudini.percezione), label:'Percezione del cibo'},
    ]},
  ];
  let tot=0,done=0;
  const dettaglio=[];
  pages.forEach(pg=>{
    pg.fields.forEach(f=>{
      tot++;
      if(f.ok)done++;
      else dettaglio.push(pg.nome+': '+f.label);
    });
  });
  return {pct:Math.round(done/tot*100), done, tot, mancanti:dettaglio};
}

function exportData(){
  const comp=calcCompletion();
  if(comp.pct<80){
    const box=document.getElementById('export-warning');
    if(box){
      box.style.display='block';
      box.innerHTML=`<strong>‚ö†Ô∏è Compilazione insufficiente (${comp.pct}%)</strong><br>Per esportare la scheda devi completare almeno l'80% dei campi. Mancano:<ul style="margin:.5rem 0 0;padding-left:1.2rem">${comp.mancanti.map(m=>`<li>${m}</li>`).join('')}</ul>`;
      box.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return;
  }
  const bmr=calcBMR(data.sesso,data.eta,data.peso,data.altezza);
  const mult=getMultiplier(data.passi,data.sport,data.sportFreq);
  const tdeeBase=Math.round(bmr*mult);
  const tdee=Math.round(tdeeBase*getSurplus(data.obiettivo));
  const macros=getMacros(tdee,data.peso,data.protFactor);
  const selNames=getSelected().map(f=>({id:f.id,nome:f.n,categoria:Object.keys(FOODS).find(c=>FOODS[c].find(x=>x.id===f.id))}));

  const payload={
    _tipo:'scheda_alimentare_ALI',
    _versione:1,
    _dataExport:new Date().toISOString(),
    anagrafica:{nome:data.nome,sesso:data.sesso,eta:data.eta,peso:data.peso,altezza:data.altezza},
    obiettivo:data.obiettivo,
    apportoProteico:data.protFactor,
    stileVita:{lavoro:data.lavoro,passi:data.passi,sport:data.sport,sportFreq:data.sportFreq},
    esclusioni:data.esclusioni,
    alimentiSelezionati:selNames,
    abitudini:data.abitudini||{},
    calcoli:{bmr,tdeeBase,targetCalorico:tdee,proteine_g:macros.prot,carboidrati_g:macros.carb,grassi_g:macros.fat,acqua_litri:+(data.peso*35/1000).toFixed(1)},
    pesate:data.pesate
  };

  const jsonStr=JSON.stringify(payload,null,2);
  const safeName=(data.nome||'cliente').replace(/[^a-z0-9]/gi,'_').toLowerCase();
  const fileName=`scheda_${safeName}_${new Date().toISOString().slice(0,10)}.json`;
  deliverExport(jsonStr,fileName);
}

async function deliverExport(jsonStr,fileName){
  const isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  // Metodo 0: pagina pubblicata su claude.ai ‚Äî salvataggio tramite il visualizzatore
  // (su computer scarica il file, nell'app Claude apre la condivisione del telefono)
  if(ON_CLAUDE_HOST){
    const downloads=await DOWNLOADS_READY;
    if(downloads){
      try{
        await downloads.save({filename:fileName,data:jsonStr});
        return;
      }catch(err){
        const code=err&&err.code;
        if(code==='declined')return; // salvataggio annullato: nessun nuovo tentativo
        if(code==='rate_limited'){notify('√à gi√† aperta una richiesta di salvataggio: attendi qualche secondo e riprova.');return;}
        // salvataggio non disponibile in questa vista: si passa ai metodi alternativi
      }
    }
  }

  // Metodo 1: Web Share API con file (ideale su mobile ‚Äî invia direttamente a WhatsApp/Mail)
  const file=new File([jsonStr],fileName,{type:'application/json'});
  if(isMobile && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Scheda alimentare',text:'Scheda alimentare compilata'})
      .then(()=>{})
      .catch(()=>{showExportFallback(jsonStr,fileName);});
    return;
  }

  // Su claude.ai i download diretti del browser non partono: si apre il pannello copia/invio
  if(ON_CLAUDE_HOST){showExportFallback(jsonStr,fileName);return;}

  // Metodo 2: download classico (file HTML aperto direttamente nel browser)
  try{
    const blob=new Blob([jsonStr],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    // Su mobile mostriamo comunque il fallback come rete di sicurezza, perch√© il download
    // potrebbe fallire silenziosamente nei browser in-app (WhatsApp, Instagram, ecc.)
    if(isMobile){setTimeout(()=>showExportFallback(jsonStr,fileName),800);}
  }catch(err){
    showExportFallback(jsonStr,fileName);
  }
}

function showExportFallback(jsonStr,fileName){
  let panel=document.getElementById('export-fallback');
  if(!panel){
    panel=document.createElement('div');
    panel.id='export-fallback';
    panel.className='export-fallback-overlay';
    document.body.appendChild(panel);
  }
  const hasShare=!!navigator.share;
  panel.innerHTML=`
    <div class="export-fallback-card">
      <div class="export-fallback-head">
        <span>üìÑ Salva o invia la scheda</span>
        <button class="export-fallback-close" onclick="document.getElementById('export-fallback').remove()">‚úï</button>
      </div>
      <p class="export-fallback-msg">Se il download non √® partito automaticamente, usa uno di questi metodi:</p>
      ${hasShare?`<button class="export-fallback-btn primary" id="fb-share">üì§ Invia la scheda (WhatsApp, Mail‚Ä¶)</button>`:''}
      <button class="export-fallback-btn" id="fb-copy">üìã Copia il contenuto</button>
      <p class="export-fallback-hint">In alternativa, tieni premuto sul testo qui sotto, seleziona tutto e copia. Poi incollalo in una mail o un messaggio da inviare al consulente.</p>
      <textarea class="export-fallback-text" id="fb-textarea" readonly>${jsonStr.replace(/</g,'&lt;')}</textarea>
      <div class="export-fallback-fname">Nome file suggerito: <strong>${fileName}</strong></div>
    </div>`;

  const ta=document.getElementById('fb-textarea');
  const copyBtn=document.getElementById('fb-copy');
  copyBtn.onclick=()=>{
    ta.select();
    ta.setSelectionRange(0,999999);
    let ok=false;
    try{ok=document.execCommand('copy');}catch(e){}
    if(navigator.clipboard){
      navigator.clipboard.writeText(jsonStr).then(()=>{copyBtn.textContent='‚úì Copiato!';setTimeout(()=>copyBtn.textContent='üìã Copia il contenuto',2000);}).catch(()=>{});
    }
    if(ok){copyBtn.textContent='‚úì Copiato!';setTimeout(()=>copyBtn.textContent='üìã Copia il contenuto',2000);}
  };
  const shareBtn=document.getElementById('fb-share');
  if(shareBtn){
    shareBtn.onclick=()=>{
      const file=new File([jsonStr],fileName,{type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Scheda alimentare'}).catch(()=>{});
      }else{
        navigator.share({title:'Scheda alimentare',text:jsonStr}).catch(()=>{});
      }
    };
  }
}

function importData(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const p=JSON.parse(e.target.result);
      if(p._tipo!=='scheda_alimentare_ALI'){notify('File non valido: non √® una scheda alimentare.');return;}
      data.nome=p.anagrafica.nome||'';
      data.sesso=p.anagrafica.sesso||'M';
      data.eta=p.anagrafica.eta||40;
      data.peso=p.anagrafica.peso||70;
      data.altezza=p.anagrafica.altezza||170;
      data.obiettivo=p.obiettivo||'mantenimento';
      data.protFactor=p.apportoProteico||1.8;
      data.lavoro=p.stileVita?.lavoro||'sedentario';
      data.passi=p.stileVita?.passi||5000;
      data.sport=p.stileVita?.sport||'nessuno';
      data.sportFreq=p.stileVita?.sportFreq||0;
      data.esclusioni=p.esclusioni||[];
      data.alimenti=(p.alimentiSelezionati||[]).map(a=>a.id);
      data.abitudini=p.abitudini||{};
      data.pesate=p.pesate||[];
      data.passiTouched=true;
      data.esclusioniTouched=true;
      current=4;
      renderStep();
    }catch(err){notify('Errore nella lettura del file: '+err.message);}
  };
  reader.readAsText(file);
}


function renderPesata(){
  const today=new Date().toISOString().slice(0,10);
  let rows='';
  if(data.pesate.length===0){
    rows=`<tr><td colspan="4"><div class="empty-pesate">Nessuna pesata registrata.<br>Aggiungi la prima misurazione per iniziare il tracciamento settimanale.</div></td></tr>`;
  } else {
    const sorted=[...data.pesate].sort((a,b)=>a.data.localeCompare(b.data));
    rows=sorted.map((pe,i)=>{
      let delta='‚Äî',cls='peso-delta-zero';
      if(i>0){
        const d=(pe.peso-sorted[i-1].peso);
        const dr=(d>0?'+':'')+d.toFixed(1)+' kg';
        cls=d<0?'peso-delta-neg':d>0?'peso-delta-pos':'peso-delta-zero';
        delta=dr;
      }
      const dataIt=pe.data.split('-').reverse().join('/');
      return`<tr><td>${dataIt}</td><td>${pe.peso.toFixed(1)} kg</td><td class="${cls}">${delta}</td><td><button class="btn-del" onclick="delPesata('${pe.data}')" title="Elimina">√ó</button></td></tr>`;
    }).join('');
  }

  let trend='';
  if(data.pesate.length>=2){
    const sorted=[...data.pesate].sort((a,b)=>a.data.localeCompare(b.data));
    const tot=(sorted[sorted.length-1].peso-sorted[0].peso);
    const settimane=Math.max(1,Math.round((new Date(sorted[sorted.length-1].data)-new Date(sorted[0].data))/(7*86400000)));
    const settiman=settimane>0?(tot/settimane):0;
    const trendCls=tot<0?'peso-delta-neg':tot>0?'peso-delta-pos':'peso-delta-zero';
    trend=`<div class="metric-grid" style="margin-top:1rem">
      <div class="metric"><div class="metric-label">Variazione totale</div><div class="metric-value ${trendCls}" style="font-size:20px">${tot>0?'+':''}${tot.toFixed(1)} <span class="metric-unit">kg</span></div></div>
      <div class="metric"><div class="metric-label">Media settimanale</div><div class="metric-value" style="font-size:20px">${settiman>0?'+':''}${settiman.toFixed(2)} <span class="metric-unit">kg/sett</span></div></div>
      <div class="metric"><div class="metric-label">Misurazioni</div><div class="metric-value" style="font-size:20px">${data.pesate.length}</div></div>
    </div>`;
  }

  return`
  <p style="font-size:14px;color:#666;margin-bottom:1rem">Registra il peso una volta a settimana, sempre lo stesso giorno e a digiuno per dati coerenti.</p>
  <div class="card">
    <div class="peso-input-row">
      <div><div class="field-label">Data</div><input type="date" id="pe-data" value="${today}"></div>
      <div><div class="field-label">Peso (kg)</div><input type="number" id="pe-peso" step="0.1" min="30" max="200" placeholder="es. 67.5"></div>
      <button class="btn-add" onclick="addPesata()">+ Aggiungi</button>
    </div>
  </div>
  ${data.pesate.length>=2?`<div class="chart-wrap"><canvas id="pesoChart" height="200"></canvas></div>`:''}
  ${trend}
  <table class="peso-table">
    <thead><tr><th>Data</th><th>Peso</th><th>Œî vs prec.</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function addPesata(){
  const dataVal=document.getElementById('pe-data').value;
  const pesoVal=parseFloat(document.getElementById('pe-peso').value);
  if(!dataVal||!pesoVal||isNaN(pesoVal)){notify('Inserisci data e peso validi');return;}
  data.pesate=data.pesate.filter(p=>p.data!==dataVal);
  data.pesate.push({data:dataVal,peso:pesoVal});
  document.getElementById('peso-container').innerHTML=renderPesata();
  setTimeout(drawChart,50);
}

function delPesata(d){
  data.pesate=data.pesate.filter(p=>p.data!==d);
  document.getElementById('peso-container').innerHTML=renderPesata();
  setTimeout(drawChart,50);
}

function drawChart(){
  const cv=document.getElementById('pesoChart');
  if(!cv||data.pesate.length<2)return;
  const sorted=[...data.pesate].sort((a,b)=>a.data.localeCompare(b.data));
  const ctx=cv.getContext('2d');
  const W=cv.width=cv.offsetWidth*2,H=cv.height=400;
  ctx.scale(1,1);
  ctx.clearRect(0,0,W,H);
  const pad=60;
  const pesos=sorted.map(p=>p.peso);
  const min=Math.min(...pesos)-1,max=Math.max(...pesos)+1;
  const range=max-min||1;
  const px=(i)=>pad+(i/(sorted.length-1))*(W-pad*1.5);
  const py=(v)=>H-pad-((v-min)/range)*(H-pad*1.8);

  // grid
  ctx.strokeStyle='#e0e0db';ctx.lineWidth=1;ctx.fillStyle='#999';ctx.font='22px system-ui';
  for(let i=0;i<=4;i++){
    const v=min+(range*i/4);const y=py(v);
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad*0.5,y);ctx.stroke();
    ctx.fillText(v.toFixed(1),8,y+7);
  }
  // line
  ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();
  sorted.forEach((p,i)=>{const x=px(i),y=py(p.peso);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
  // points + labels
  ctx.fillStyle='#2563eb';
  sorted.forEach((p,i)=>{
    const x=px(i),y=py(p.peso);
    ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
    ctx.fillStyle='#1a1a1a';ctx.font='bold 22px system-ui';ctx.textAlign='center';
    ctx.fillText(p.peso.toFixed(1),x,y-16);
    ctx.fillStyle='#999';ctx.font='18px system-ui';
    ctx.fillText(p.data.slice(5).split('-').reverse().join('/'),x,H-pad+28);
    ctx.fillStyle='#2563eb';
  });
  ctx.textAlign='left';
}

function collectStep(){
  if(current===0&&document.getElementById('f-nome')){
    data.nome=document.getElementById('f-nome')?.value||'';
    data.sesso=document.getElementById('f-sesso')?.value||'M';
    const e=document.getElementById('f-eta')?.value;
    const p=document.getElementById('f-peso')?.value;
    const a=document.getElementById('f-altezza')?.value;
    data.eta=e?parseInt(e):null;
    data.peso=p?parseFloat(p):null;
    data.altezza=a?parseInt(a):null;
  }
}

function next(){collectStep();if(current<5){current++;renderStep();}}
function back(){if(current>0){current--;renderStep();}}

function attach(){
  document.querySelectorAll('[data-obiettivo]').forEach(b=>b.addEventListener('click',()=>{data.obiettivo=b.dataset.obiettivo;renderStep();}));
  document.querySelectorAll('[data-lavoro]').forEach(b=>b.addEventListener('click',()=>{data.lavoro=b.dataset.lavoro;renderStep();}));
  document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener('click',()=>{data.sport=b.dataset.sport;if(data.sport!=='nessuno'&&!data.sportFreq)data.sportFreq=2;renderStep();}));
  document.querySelectorAll('[data-freq]').forEach(b=>b.addEventListener('click',()=>{data.sportFreq=parseInt(b.dataset.freq);renderStep();}));
  document.querySelectorAll('[data-excl]').forEach(b=>b.addEventListener('click',()=>{data.esclusioniTouched=true;const e=b.dataset.excl;data.esclusioni=data.esclusioni.includes(e)?data.esclusioni.filter(x=>x!==e):[...data.esclusioni,e];renderStep();}));
  document.querySelectorAll('[data-fid]').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.fid;data.alimenti=data.alimenti.includes(f)?data.alimenti.filter(x=>x!==f):[...data.alimenti,f];b.classList.toggle('selected',data.alimenti.includes(f));}));
  const sl=document.getElementById('f-passi');
  if(sl)sl.addEventListener('input',()=>{data.passi=parseInt(sl.value);data.passiTouched=true;document.getElementById('passi-val').textContent=data.passi.toLocaleString('it-IT');});
}

renderStep();
</script>
